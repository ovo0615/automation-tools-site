# Temporary check for the video page PR: run the same test and build as the deploy workflow (guard terms and
# external link check included) on this branch without deploying. Removed again before review.
name: Temporary branch build check
on:
  push:
    branches: [claude/sharp-feynman-xbaca4]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SITE_GUARD_TERMS: ${{ secrets.SITE_GUARD_TERMS }}
